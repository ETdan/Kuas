<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings</title>
</head>
<body>
    <h1>Standings</h1>
    <div class="table-wrapper">
        <table id="standingTable">
            <thead>
                <tr>
                    <th title="Rank">Rk</th>
                    <th title="Team (logo and name)">Team</th>
                    <th title="Points">Pts</th>
                    <th title="Games Played">GP</th>
                    <th title="Wins">W</th>
                    <th title="Losses">L</th>
                    <th title="Ties / Draws">T</th>
                    <th title="Points For (scored)">PF</th>
                    <th title="Points Against (conceded)">PA</th>
                    <th title="Point Differential">PD</th>
                    <th title="Home Wins">HW</th>
                    <th title="Home Losses">HL</th>
                    <th title="Home Ties">HT</th>
                    <th title="Home Games Played">HGP</th>
                    <th title="Home Points For">HPF</th>
                    <th title="Home Points Against">HPA</th>
                    <th title="Away Wins">AW</th>
                    <th title="Away Losses">AL</th>
                    <th title="Away Ties">AT</th>
                    <th title="Away Games Played">AGP</th>
                    <th title="Away Points For">APF</th>
                    <th title="Away Points Against">APA</th>
                    <th title="Current streak">Str</th>
                </tr>
            </thead>
            <tbody id="standingTableBody">
                <!-- Standings will be populated here -->
            </tbody>
        </table>
    </div>

</body>
</html>
